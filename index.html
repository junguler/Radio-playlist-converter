<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Playlist Converter</title>
<style>
/* Concrete Signal - shared look for the M3U tool pages. System fonts only, no external requests. */
:root {
  --concrete: #2b2b2b;
  --panel: #1a1a1a;
  --line: #e6e6e6;
  --ink: #000000;
  --text: #ffffff;
  --muted: #bdbdbd;
  --orange: #ff6a1a;
  --pink: #ff4fa3;
  --violet: #a77bff;
  --green: #3ddc84;
  --yellow: #ffd100;
  --red: #ff3b30;
  --blue: #3d8bff;
  --bw: 4px;
  --mono: ui-monospace, Consolas, "Courier New", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 10px 60px;
  font-family: var(--mono);
  font-size: 14px;
  background: var(--concrete);
  color: var(--text);
}
h1 {
  margin: -20px -20px 18px;
  padding: 8px 14px;
  background: var(--yellow);
  color: var(--ink);
  border-bottom: var(--bw) solid var(--yellow);
  font-size: 1.9em;
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-align: left;
}
.container {
  position: relative;
  width: 660px;
  max-width: 100%;
  margin: 0 auto;
  padding: 20px;
  background: var(--panel);
  border: var(--bw) solid var(--line);
  box-shadow: 10px 10px 0 var(--ink);
  text-align: left;
}
.input-group { display: flex; align-items: center; gap: 10px; }
textarea, input, select {
  flex-grow: 1;
  min-width: 0;
  margin: 5px 0;
  padding: 10px;
  border: var(--bw) solid var(--line);
  border-radius: 0;
  background: var(--ink);
  color: var(--text);
  font: inherit;
}
input[type='file']::file-selector-button {
  margin-right: 10px;
  padding: 6px 12px;
  border: 3px solid var(--ink);
  border-radius: 0;
  background: var(--orange);
  color: var(--ink);
  font: inherit;
  font-weight: 900;
  -webkit-text-stroke: 0.6px currentColor;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}
input[type='file']::file-selector-button:hover { filter: brightness(1.1); }
::placeholder { color: var(--muted); opacity: 1; }
textarea { resize: vertical; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
textarea:focus, input:focus, select:focus { border-color: var(--yellow); }

/* Buttons: one colour per role, set through --c */
button {
  --c: var(--orange);
  flex: none;
  width: 130px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  border: var(--bw) solid var(--ink);
  border-radius: 0;
  background: var(--c);
  color: var(--ink);
  font: inherit;
  font-size: 0.95em;
  font-weight: 900;
  -webkit-text-stroke: 0.6px currentColor;
  letter-spacing: 0.04em;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--text);
  cursor: pointer;
}
button:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--text); }
button:active { box-shadow: none; transform: translate(3px, 3px); }
button:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; filter: grayscale(0.6); transform: none; }

#fileCheckButton, #fileButton { --c: var(--orange); }
#urlCheckButton, #urlButton { --c: var(--pink); }
#textCheckButton, #textButton { --c: var(--violet); }
.pause-button { display: none; --c: var(--blue); }
.cancel-button { display: none; --c: var(--red); }

#downloadButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 10px auto;
  --c: var(--green);
}
#downloadReportButton, #downloadDeadButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 0 auto 10px auto;
  --c: var(--yellow);
}
#viewImagesButton {
  display: none;
  width: 260px;
  height: 48px;
  margin: 0 auto 10px auto;
  --c: var(--line);
}
.download-row { display: flex; flex-direction: column; align-items: center; gap: 5px; }

/* Output area */
.output-wrapper {
  position: relative;
  width: 100%;
  height: 180px;
  min-width: 0;
  min-height: 80px;
  max-width: 100%;
  max-height: 80vh;
  margin: 5px 0 10px 0;
  border: var(--bw) solid var(--line);
  background: var(--ink);
  resize: vertical;
  overflow: auto;
}
.output-wrapper textarea#output {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 0.85em;
  resize: none;
  overflow: auto;
  display: block;
  white-space: pre;
}
#summaryLine {
  min-height: 1em;
  margin: 5px 0 10px 0;
  font-size: 0.85em;
  color: var(--muted);
  text-align: left;
}

/* Advanced settings panel */
.advanced-settings {
  margin: 5px 0 10px 0;
  border: var(--bw) solid var(--line);
  background: var(--ink);
  text-align: left;
}
.advanced-settings summary {
  padding: 10px;
  cursor: pointer;
  user-select: none;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.advanced-settings summary:hover { background: #222222; }
.advanced-settings .settings-grid {
  padding: 10px;
  border-top: var(--bw) solid var(--line);
  background: var(--panel);
}
.advanced-settings .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.setting-item { display: flex; flex-direction: column; font-size: 0.9em; }
.setting-item label { margin-bottom: 3px; }
.setting-item input[type='text'],
.setting-item input[type='number'] { margin: 0; }
.checkbox-item { flex-direction: row; align-items: center; gap: 6px; margin-top: 20px; }
.checkbox-item input { flex-grow: 0; width: auto; margin: 0; padding: 0; accent-color: var(--orange); }

select { height: 46px; }
.settings { margin: 5px 0; padding: 5px 0; }
.settings .input-group label { flex-shrink: 0; width: 130px; padding: 10px 0; text-align: left; font-size: 0.85em; font-weight: 800; text-transform: uppercase; }
.settings .input-group select { margin-right: 0; }
.output-wrapper p#status {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 10px;
  border: none;
  background: var(--ink);
  text-align: left;
  white-space: pre-wrap;
  overflow: auto;
  display: none;
}
.warning { color: var(--yellow); }
.success { color: var(--green); }
@media (max-width: 660px) {
  .advanced-settings .settings-grid { grid-template-columns: 1fr; }
  .checkbox-item { margin-top: 0; }
}
@media (max-width: 560px) {
  .input-group { flex-wrap: wrap; }
  .input-group > input, .input-group > textarea { flex: 1 1 100%; }
  .input-group > button { flex: 1 1 90px; width: auto; }
  .settings .input-group { flex-wrap: nowrap; }
  .settings .input-group > select { flex: 1 1 auto; }
}
</style>
</head>
<body>
<div class="container">
<h1>Radio Playlist Converter</h1>

<div class="input-group">
  <input type="file" id="fileInput" accept=".m3u,.m3u8,.pls,.xspf,.wpl,.asx,.xml,.csv,.txt,.json">
  <button id="fileButton">Load local file</button>
  <button id="cancelButton" class="cancel-button">Cancel</button>
</div>

<div class="input-group">
  <input type="text" id="urlInput" placeholder="Enter online playlist URL...">
  <button id="urlButton">Load Online Link</button>
</div>

<div class="input-group">
  <textarea id="textInput" rows="3" placeholder="Paste playlist content here..."></textarea>
  <button id="textButton">Load Pasted playlist</button>
</div>

<div class="settings">
  <div class="input-group">
    <label for="inputFormat">Input format</label>
    <select id="inputFormat">
      <option value="auto">Auto-detect</option>
      <option value="m3u">M3U / M3U8</option>
      <option value="pls">PLS</option>
      <option value="xspf">XSPF</option>
      <option value="wpl">WPL</option>
      <option value="asx">ASX</option>
      <option value="csv">CSV</option>
      <option value="json">JSON</option>
      <option value="txt">Plain text URLs</option>
    </select>
  </div>
  <div class="input-group">
    <label for="outputFormat">Convert to</label>
    <select id="outputFormat">
      <option value="pls">PLS</option>
      <option value="m3u">M3U</option>
      <option value="m3u8">M3U8</option>
      <option value="xspf">XSPF</option>
      <option value="wpl">WPL</option>
      <option value="asx">ASX</option>
      <option value="csv">CSV</option>
      <option value="json">JSON</option>
      <option value="txt">Plain text URLs</option>
    </select>
  </div>
</div>

<details class="advanced-settings">
  <summary>Advanced settings</summary>
  <div class="settings-grid">
    <div class="setting-item">
      <label for="playlistName">Playlist name</label>
      <input type="text" id="playlistName" placeholder="Converted Playlist">
    </div>
    <div class="setting-item">
      <label for="encodingNote">Metadata handling</label>
      <select id="encodingNote">
        <option value="preserve">Preserve available metadata</option>
        <option value="basic">Basic name + URL only</option>
      </select>
    </div>
    <div class="setting-item checkbox-item">
      <input type="checkbox" id="dedupeCheckbox" checked>
      <label for="dedupeCheckbox">Remove duplicate URLs</label>
    </div>
    <div class="setting-item checkbox-item">
      <input type="checkbox" id="skipEmptyCheckbox" checked>
      <label for="skipEmptyCheckbox">Skip entries without URLs</label>
    </div>
  </div>
</details>

<div class="output-wrapper">
  <textarea id="output" readonly></textarea>
  <p id="status"></p>
</div>

<p id="summaryLine"></p>

<button id="downloadButton">Download Converted Playlist</button>
<a id="downloadLink" style="display:none"></a>
</div>

<script>
(() => {
  'use strict';
  let rawEntries = []; /* everything the parser found */
  let currentEntries = []; /* after the duplicate / empty filters */
  let sourceName = 'playlist';
  let convertedText = '';
  let fetchController = null;

  const xmlEsc = (value) =>
    String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');

  const $ = (id) => document.getElementById(id);

  /* one line, safe inside M3U / PLS values */
  const oneLine = (value) =>
    String(value ?? '')
      .replace(/[\r\n]+/g, ' ')
      .trim();

  function getOptions() {
    return {
      playlistName: $('playlistName').value.trim() || 'Converted Playlist',
      preserve: $('encodingNote').value === 'preserve',
    };
  }

  /* case-insensitive element lookup: ASX files come in any capitalization */
  const elementsByName = (root, name) =>
    [...root.getElementsByTagName('*')].filter((n) => n.localName.toLowerCase() === name);

  const attrOf = (el, name) => {
    const attr = [...(el ? el.attributes : [])].find((a) => a.name.toLowerCase() === name);
    return attr ? attr.value : '';
  };

  function setStatus(text, visible = true) {
    const status = document.getElementById('status');
    status.textContent = text;
    status.style.display = visible ? 'block' : 'none';
    document.getElementById('output').style.display = visible ? 'none' : 'block';
  }

  function renderOutput() {
    if (!currentEntries.length) return;
    try {
      convertedText = convertEntries(currentEntries, document.getElementById('outputFormat').value);
      document.getElementById('output').value = convertedText;
      setStatus('', false);
      document.getElementById('summaryLine').textContent =
        `${currentEntries.length} entries ready • ${formatName(document.getElementById('outputFormat').value)}`;
    } catch (error) {
      setStatus(`Conversion error: ${error.message}`);
    }
  }

  function formatName(format) {
    return (
      {
        m3u: 'M3U',
        m3u8: 'M3U8',
        pls: 'PLS',
        xspf: 'XSPF',
        wpl: 'WPL',
        asx: 'ASX',
        csv: 'CSV',
        json: 'JSON',
        txt: 'plain text',
      }[format] || format.toUpperCase()
    );
  }

  function normalizeEntry(entry) {
    const e = {
      name: String(entry.name || entry.title || '').trim(),
      url: String(entry.url || entry.location || '').trim(),
      duration: Number.isFinite(Number(entry.duration)) ? Number(entry.duration) : -1,
      artist: String(entry.artist || '').trim(),
      album: String(entry.album || '').trim(),
      genre: String(entry.genre || '').trim(),
      logo: String(entry.logo || entry.image || '').trim(),
      group: String(entry.group || entry.category || '').trim(),
    };
    if (!e.name) e.name = e.url || 'Unknown';
    return e;
  }

  function cleanEntries(entries) {
    let result = entries.map(normalizeEntry);
    const skipEmpty = document.getElementById('skipEmptyCheckbox').checked;
    if (skipEmpty) result = result.filter((e) => e.url);

    if (document.getElementById('dedupeCheckbox').checked) {
      const seen = new Set();
      result = result.filter((e) => {
        const key = e.url.toLowerCase();
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }
    return result;
  }

  /* split at the first comma that is not inside quotes */
  function splitExtinf(line) {
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') inQuotes = !inQuotes;
      else if (line[i] === ',' && !inQuotes) {
        return { prefix: line.slice(0, i), title: line.slice(i + 1).trim() };
      }
    }

    return { prefix: line, title: '' };
  }

  function parseM3U(text) {
    const entries = [];
    let pending = null;

    for (const raw of text.replace(/^\uFEFF/, '').split(/\r?\n/)) {
      const line = raw.trim();

      if (!line) continue;

      if (/^#EXTINF:/i.test(line)) {
        const { prefix, title } = splitExtinf(line);
        const duration = prefix.match(/^#EXTINF:\s*(-?\d+(?:\.\d+)?)/i);

        const attrs = {};
        const attrRe = /([A-Za-z0-9_-]+)="([^"]*)"/g;
        let m;

        while ((m = attrRe.exec(prefix))) attrs[m[1].toLowerCase()] = m[2];

        pending = {
          name: title,
          url: '',
          duration: duration ? Number(duration[1]) : -1,
          artist: attrs.artist || '',
          album: attrs.album || '',
          genre: attrs['group-title'] || attrs.genre || '',
          logo: attrs['tvg-logo'] || attrs.logo || '',
          group: attrs['group-title'] || '',
        };

        continue;
      }

      if (/^#EXTGRP:/i.test(line) && pending) {
        pending.group = line.slice(line.indexOf(':') + 1).trim();
        continue;
      }

      if (line.startsWith('#')) continue;

      /* after an #EXTINF the next plain line is its URL, whatever the scheme */
      entries.push(pending ? { ...pending, url: line } : { name: line, url: line, duration: -1 });
      pending = null;
    }

    return entries;
  }

  function parsePLS(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    const map = {};
    let title = '';
    let entries = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith(';')) continue;
      const eq = line.indexOf('=');
      if (eq < 0) continue;
      const key = line.slice(0, eq).trim();
      const value = line.slice(eq + 1).trim();
      const m = key.match(/^File(\d+)$/i);
      const t = key.match(/^Title(\d+)$/i);
      const d = key.match(/^Length(\d+)$/i);
      if (m) {
        const n = m[1];
        if (!map[n]) map[n] = {};
        map[n].url = value;
      } else if (t) {
        const n = t[1];
        if (!map[n]) map[n] = {};
        map[n].name = value;
      } else if (d) {
        const n = d[1];
        if (!map[n]) map[n] = {};
        map[n].duration = Number(value);
      } else if (/^Playlist\d*$/i.test(key)) {
        title = value;
      }
    }
    entries = Object.keys(map)
      .sort((a, b) => Number(a) - Number(b))
      .map((n) => ({
        name: map[n].name || map[n].url || 'Unknown',
        url: map[n].url || '',
        duration: Number.isFinite(map[n].duration) ? map[n].duration : -1,
      }));
    return { entries, title };
  }

  function parseXSPF(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Invalid XSPF/XML document.');
    const playlistName = doc.querySelector('playlist > title')?.textContent?.trim() || '';
    const entries = [...doc.querySelectorAll('track')].map((track) => {
      const get = (tag) => track.querySelector(tag)?.textContent?.trim() || '';
      const durationMs = get('duration') === '' ? NaN : Number(get('duration'));
      return {
        name: get('title') || get('location') || 'Unknown',
        url: get('location'),
        duration: Number.isFinite(durationMs) ? Math.round(durationMs / 1000) : -1,
        artist: get('creator'),
        album: get('album'),
        genre: get('genre'),
      };
    });
    return { entries, title: playlistName };
  }

  function parseWPL(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Invalid WPL/XML document.');
    const entries = [...doc.querySelectorAll('media')].map((media) => ({
      name:
        media.getAttribute('title') ||
        media.getAttribute('name') ||
        media.getAttribute('src') ||
        'Unknown',
      url: media.getAttribute('src') || '',
      duration: -1,
    }));
    const title = doc.querySelector('head > title')?.textContent?.trim() || '';
    return { entries, title };
  }

  function parseASX(text) {
    let doc = new DOMParser().parseFromString(text, 'application/xml');

    /* real-world ASX is often not valid XML: the HTML parser is forgiving */
    if (doc.querySelector('parsererror')) {
      doc = new DOMParser().parseFromString(text, 'text/html');
    }

    const text1 = (el, name) => {
      const found = elementsByName(el, name)[0];
      return found ? found.textContent.trim() : '';
    };

    const entries = elementsByName(doc, 'entry').map((entry) => {
      const url = attrOf(elementsByName(entry, 'ref')[0], 'href');

      return {
        name: text1(entry, 'title') || url || 'Unknown',
        url,
        duration: -1,
        artist: text1(entry, 'author'),
      };
    });

    if (!entries.length && !elementsByName(doc, 'asx').length) {
      throw new Error('Invalid ASX document.');
    }

    return { entries, title: attrOf(elementsByName(doc, 'asx')[0], 'title') };
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const rows = [];
    let row = [],
      cell = '',
      quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (quoted && text[i + 1] === '"') {
          cell += '"';
          i++;
        } else quoted = !quoted;
      } else if (c === ',' && !quoted) {
        row.push(cell);
        cell = '';
      } else if ((c === '\n' || c === '\r') && !quoted) {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell);
        cell = '';
        if (row.some((v) => v.trim())) rows.push(row);
        row = [];
      } else cell += c;
    }
    if (cell || row.length) {
      row.push(cell);
      if (row.some((v) => v.trim())) rows.push(row);
    }
    if (!rows.length) return [];
    const headers = rows[0].map((h) => h.trim().toLowerCase());
    const find = (names) => {
      for (const n of names) {
        const i = headers.indexOf(n);
        if (i >= 0) return i;
      }
      return -1;
    };
    const nameI = find(['name', 'title', 'station', 'track']);
    const urlI = find(['url', 'location', 'file', 'src', 'stream']);
    const durationI = find(['duration', 'length']);
    const artistI = find(['artist', 'creator']);
    const albumI = find(['album']);
    const groupI = find(['group', 'group-title', 'category']);
    const genreI = find(['genre']) >= 0 ? find(['genre']) : groupI;
    const logoI = find(['logo', 'tvg-logo', 'image']);
    const looksLikeHeader = urlI >= 0 || nameI >= 0;
    const start = looksLikeHeader ? 1 : 0;
    return rows.slice(start).map((r) => ({
      name: r[nameI >= 0 ? nameI : 0] || '',
      url: r[urlI >= 0 ? urlI : Math.min(1, r.length - 1)] || '',
      duration: durationI >= 0 ? Number(r[durationI]) : -1,
      artist: artistI >= 0 ? r[artistI] : '',
      album: albumI >= 0 ? r[albumI] : '',
      genre: genreI >= 0 ? r[genreI] : '',
      group: groupI >= 0 ? r[groupI] : '',
      logo: logoI >= 0 ? r[logoI] : '',
    }));
  }

  function parseJSON(text) {
    const data = JSON.parse(text);
    const arr = Array.isArray(data)
      ? data
      : Array.isArray(data.entries)
        ? data.entries
        : Array.isArray(data.tracks)
          ? data.tracks
          : Array.isArray(data.playlist)
            ? data.playlist
            : null;
    if (!arr) throw new Error('JSON must contain an array of playlist entries.');
    return arr.map((e) => (typeof e === 'string' ? { name: e, url: e } : e));
  }

  function parseTXT(text) {
    return text
      .split(/\r?\n/)
      .map((s) => s.trim())
      .filter((s) => s && !s.startsWith('#'))
      .map((url) => ({ name: url, url, duration: -1 }));
  }

  function detectFormat(text, fileName = '') {
    const ext = fileName.toLowerCase().split('.').pop();
    if (['m3u', 'm3u8'].includes(ext)) return 'm3u';
    if (ext === 'pls') return 'pls';
    if (ext === 'xspf') return 'xspf';
    if (ext === 'wpl') return 'wpl';
    if (ext === 'asx') return 'asx';
    if (ext === 'csv') return 'csv';
    if (ext === 'json') return 'json';

    const trimmed = text.trim();
    if (/^#EXTM3U\b/i.test(trimmed) || /^#EXTINF:/im.test(trimmed)) return 'm3u';
    if (/^\s*\[playlist\]/im.test(trimmed) || /\bFile\d+=/i.test(trimmed)) return 'pls';
    if (/<playlist[^>]*xmlns=["']http:\/\/xspf\.org/i.test(trimmed)) return 'xspf';
    if (/<smil\b/i.test(trimmed) || /<wpl\b/i.test(trimmed)) return 'wpl';
    if (/<asx\b/i.test(trimmed)) return 'asx';
    if (/^\s*[\[{]/.test(trimmed)) return 'json';
    if (
      trimmed.includes(',') &&
      /(^|,)(url|location|name|title)(,|$)/im.test(trimmed.split(/\r?\n/)[0])
    )
      return 'csv';
    return 'txt';
  }

  function parsePlaylist(text, format) {
    switch (format) {
      case 'm3u':
        return { entries: parseM3U(text), title: '' };
      case 'pls':
        return parsePLS(text);
      case 'xspf':
        return parseXSPF(text);
      case 'wpl':
        return parseWPL(text);
      case 'asx':
        return parseASX(text);
      case 'csv':
        return { entries: parseCSV(text), title: '' };
      case 'json':
        return { entries: parseJSON(text), title: '' };
      case 'txt':
        return { entries: parseTXT(text), title: '' };
      default:
        throw new Error(`Unsupported input format: ${format}`);
    }
  }

  function formatDuration(seconds) {
    const n = Number(seconds);
    // This converter is intended for radio/live streams.
    // Unknown, zero, or negative durations are represented as indefinite (-1).
    return Number.isFinite(n) && n > 0 ? String(Math.round(n)) : '-1';
  }

  function convertM3U(entries) {
    const lines = ['#EXTM3U'];
    const attr = (key, value) => (value ? ` ${key}="${oneLine(value).replace(/"/g, "'")}"` : '');

    for (const e of entries) {
      const attrs =
        attr('tvg-logo', e.logo) +
        attr('group-title', e.group) +
        attr('artist', e.artist) +
        attr('album', e.album);

      lines.push(`#EXTINF:${formatDuration(e.duration)}${attrs},${oneLine(e.name)}`);

      if (e.group) lines.push(`#EXTGRP:${oneLine(e.group)}`);

      lines.push(oneLine(e.url));
    }

    return lines.join('\n');
  }

  function convertPLS(entries) {
    const lines = ['[playlist]'];
    entries.forEach((e, i) => {
      const n = i + 1;
      lines.push(`File${n}=${oneLine(e.url)}`);
      lines.push(`Title${n}=${oneLine(e.name)}`);
      lines.push(`Length${n}=${formatDuration(e.duration)}`);
    });
    lines.push(`NumberOfEntries=${entries.length}`);
    lines.push('Version=2');
    return lines.join('\n');
  }

  function convertXSPF(entries, { playlistName: name }) {
    const lines = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<playlist version="1" xmlns="http://xspf.org/ns/0/">',
      `  <title>${xmlEsc(name)}</title>`,
      '  <trackList>',
    ];
    for (const e of entries) {
      lines.push('    <track>');
      lines.push(`      <location>${xmlEsc(e.url)}</location>`);
      lines.push(`      <title>${xmlEsc(e.name)}</title>`);
      if (e.artist) lines.push(`      <creator>${xmlEsc(e.artist)}</creator>`);
      if (e.album) lines.push(`      <album>${xmlEsc(e.album)}</album>`);
      if (e.genre) lines.push(`      <genre>${xmlEsc(e.genre)}</genre>`);
      if (e.duration >= 0)
        lines.push(`      <duration>${Math.round(e.duration * 1000)}</duration>`);
      lines.push('    </track>');
    }
    lines.push('  </trackList>', '</playlist>');
    return lines.join('\n');
  }

  function convertWPL(entries, { playlistName: name }) {
    const lines = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      '<smil xmlns="http://www.w3.org/2001/SMIL20/Language">',
      '  <head>',
      `    <title>${xmlEsc(name)}</title>`,
      '  </head>',
      '  <body>',
      '    <seq>',
    ];
    for (const e of entries) {
      lines.push(`      <media src="${xmlEsc(e.url)}" title="${xmlEsc(e.name)}" />`);
    }
    lines.push('    </seq>', '  </body>', '</smil>');
    return lines.join('\n');
  }

  function convertASX(entries, { playlistName: name }) {
    const lines = [
      '<?xml version="1.0" encoding="UTF-8"?>',
      `<ASX version="3.0" TITLE="${xmlEsc(name)}">`,
    ];
    for (const e of entries) {
      lines.push('  <Entry>');
      lines.push(`    <Title>${xmlEsc(e.name)}</Title>`);
      if (e.artist) lines.push(`    <Author>${xmlEsc(e.artist)}</Author>`);
      lines.push(`    <Ref href="${xmlEsc(e.url)}" />`);
      lines.push('  </Entry>');
    }
    lines.push('</ASX>');
    return lines.join('\n');
  }

  function csvCell(value) {
    return `"${String(value ?? '').replace(/"/g, '""')}"`;
  }

  function convertCSV(entries) {
    const headers = ['name', 'url', 'duration', 'artist', 'album', 'genre', 'logo', 'group'];
    const lines = [headers.join(',')];
    for (const e of entries) {
      lines.push(headers.map((h) => csvCell(e[h])).join(','));
    }
    return lines.join('\n');
  }

  function convertJSON(entries, { preserve }) {
    return JSON.stringify(
      entries.map((e) =>
        preserve
          ? e
          : {
              name: e.name,
              url: e.url,
              duration: e.duration,
            },
      ),
      null,
      2,
    );
  }

  function convertTXT(entries) {
    return entries.map((e) => e.url).join('\n');
  }

  function convertEntries(entries, format, options = getOptions()) {
    switch (format) {
      case 'm3u':
        return convertM3U(entries);
      case 'm3u8':
        return convertM3U(entries);
      case 'pls':
        return convertPLS(entries);
      case 'xspf':
        return convertXSPF(entries, options);
      case 'wpl':
        return convertWPL(entries, options);
      case 'asx':
        return convertASX(entries, options);
      case 'csv':
        return convertCSV(entries);
      case 'json':
        return convertJSON(entries, options);
      case 'txt':
        return convertTXT(entries);
      default:
        throw new Error(`Unsupported output format: ${format}`);
    }
  }

  function baseOutputName() {
    let base = sourceName.replace(/\.[^.]+$/, '');
    if (!base || base === 'playlist') base = 'playlist';
    return `${base}_converted`;
  }

  function finishLoad(text, fileName) {
    sourceName = fileName || 'playlist';
    const requested = document.getElementById('inputFormat').value;
    const format = requested === 'auto' ? detectFormat(text, fileName) : requested;

    try {
      const parsed = parsePlaylist(text, format);
      if (parsed.title && !document.getElementById('playlistName').value.trim()) {
        document.getElementById('playlistName').value = parsed.title;
      }
      rawEntries = parsed.entries || [];
      currentEntries = cleanEntries(rawEntries);
      if (!currentEntries.length) throw new Error('No playlist entries with URLs were found.');

      convertedText = convertEntries(currentEntries, document.getElementById('outputFormat').value);
      document.getElementById('output').value = convertedText;
      setStatus('', false);
      document.getElementById('downloadButton').style.display = 'block';

      const removed = rawEntries.length - currentEntries.length;
      document.getElementById('summaryLine').textContent =
        `Loaded ${rawEntries.length} entries • ${currentEntries.length} output entries` +
        (removed > 0 ? ` • ${removed} removed` : '') +
        ` • ${formatName(format)} → ${formatName(document.getElementById('outputFormat').value)}`;
    } catch (error) {
      rawEntries = [];
      currentEntries = [];
      convertedText = '';
      document.getElementById('output').value = '';
      document.getElementById('downloadButton').style.display = 'none';
      setStatus(`Error: ${error.message}`);
      document.getElementById('summaryLine').textContent = '';
    }
  }

  function processFile() {
    const input = document.getElementById('fileInput');
    if (!input.files.length) return alert('Please upload a playlist file.');
    const file = input.files[0];
    file
      .text()
      .then((text) => finishLoad(text, file.name))
      .catch((error) => {
        alert(`Error reading file: ${error.message}`);
      });
  }

  function parseGitHubFileURL(input) {
    let url;
    try {
      url = new URL(input);
    } catch {
      return null;
    }

    const host = url.hostname.toLowerCase();
    const parts = url.pathname.split('/').filter(Boolean);

    if (host === 'github.com') {
      // /OWNER/REPO/blob/BRANCH/PATH
      if (parts.length >= 5 && parts[2].toLowerCase() === 'blob') {
        return {
          owner: parts[0],
          repo: parts[1],
          ref: parts[3],
          path: parts.slice(4).join('/'),
        };
      }

      // /OWNER/REPO/raw/BRANCH/PATH
      if (parts.length >= 5 && parts[2].toLowerCase() === 'raw') {
        return {
          owner: parts[0],
          repo: parts[1],
          ref: parts[3],
          path: parts.slice(4).join('/'),
        };
      }
    }

    if (host === 'raw.githubusercontent.com' && parts.length >= 4) {
      let refIndex = 2;

      // /OWNER/REPO/refs/heads/BRANCH/PATH
      if (parts[2] === 'refs' && parts[3] === 'heads' && parts.length >= 5) {
        refIndex = 4;
      } else if (parts[2] === 'refs' && parts[3] === 'tags' && parts.length >= 5) {
        refIndex = 4;
      }

      if (parts.length > refIndex) {
        return {
          owner: parts[0],
          repo: parts[1],
          ref: parts[refIndex],
          path: parts.slice(refIndex + 1).join('/'),
        };
      }
    }

    return null;
  }

  function githubRawURL(info) {
    return `https://raw.githubusercontent.com/${info.owner}/${info.repo}/${info.ref}/${info.path}`;
  }

  function githubAPIURL(info) {
    return `https://api.github.com/repos/${encodeURIComponent(info.owner)}/${encodeURIComponent(info.repo)}/contents/${info.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(info.ref)}`;
  }

  function decodeBase64UTF8(base64) {
    const binary = atob(base64.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  async function fetchPlaylistText(url, signal) {
    const response = await fetch(url, { cache: 'no-store', redirect: 'follow', signal });

    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

    const text = await response.text();

    if (!text.trim()) throw new Error('The fetched playlist is empty.');

    return text;
  }

  async function fetchGitHubAPI(info, signal) {
    const response = await fetch(githubAPIURL(info), {
      cache: 'no-store',
      signal,
      headers: { Accept: 'application/vnd.github+json' },
    });

    if (!response.ok) throw new Error(`GitHub API HTTP ${response.status} ${response.statusText}`);

    const data = await response.json();

    if (!data || typeof data.content !== 'string') {
      throw new Error('GitHub API did not return file content.');
    }

    return decodeBase64UTF8(data.content);
  }

  async function fetchOnlinePlaylist(input, signal) {
    const info = parseGitHubFileURL(input);

    if (!info) return fetchPlaylistText(input, signal);

    /* raw first, the (rate-limited) API only as a fallback for public repositories */
    for (const url of new Set([githubRawURL(info), input])) {
      try {
        return await fetchPlaylistText(url, signal);
      } catch (error) {
        if (error.name === 'AbortError') throw error;
      }
    }

    try {
      return await fetchGitHubAPI(info, signal);
    } catch (error) {
      if (error.name === 'AbortError') throw error;

      throw new Error(
        `Unable to fetch the GitHub playlist. Raw GitHub and the GitHub API both failed: ${error.message}`,
      );
    }
  }

  async function processOnline() {
    const input = $('urlInput').value.trim();

    if (!input) return alert('Please enter an online playlist URL.');

    fetchController = new AbortController();

    $('cancelButton').style.display = 'flex';
    $('urlButton').disabled = true;

    setStatus('Fetching online playlist...');

    try {
      const text = await fetchOnlinePlaylist(input, fetchController.signal);

      let name = 'playlist';

      try {
        const last = new URL(input).pathname.split('/').pop();
        if (last) name = decodeURIComponent(last);
      } catch {}

      finishLoad(text, name);
    } catch (error) {
      if (error.name === 'AbortError') setStatus('Online playlist fetch cancelled.');
      else
        setStatus(
          `Error fetching online playlist: ${error.message}\nThe remote server may block browser CORS requests.`,
        );
    } finally {
      fetchController = null;
      $('cancelButton').style.display = 'none';
      $('urlButton').disabled = false;
    }
  }

  function cancelProcess() {
    if (fetchController) fetchController.abort();
  }

  function processText() {
    const text = document.getElementById('textInput').value;
    if (!text.trim()) return alert('Please paste playlist content.');
    finishLoad(text, 'pasted_playlist');
  }

  function downloadResult() {
    if (!convertedText) return;
    const format = document.getElementById('outputFormat').value;
    const mime =
      {
        m3u: 'audio/x-mpegurl',
        m3u8: 'application/vnd.apple.mpegurl',
        pls: 'audio/x-scpls',
        xspf: 'application/xspf+xml',
        wpl: 'application/vnd.ms-wpl',
        asx: 'video/x-ms-asf',
        csv: 'text/csv',
        json: 'application/json',
        txt: 'text/plain',
      }[format] || 'text/plain';

    const blob = new Blob([convertedText], { type: mime });
    const url = URL.createObjectURL(blob);
    const link = document.getElementById('downloadLink');
    link.href = url;
    link.download = `${baseOutputName()}.${format}`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.getElementById('playlistName').addEventListener('input', renderOutput);
  document.getElementById('encodingNote').addEventListener('change', renderOutput);
  document.getElementById('dedupeCheckbox').addEventListener('change', () => {
    if (!currentEntries.length) return;
    currentEntries = cleanEntries(rawEntries);
    renderOutput();
  });
  document.getElementById('skipEmptyCheckbox').addEventListener('change', () => {
    if (!currentEntries.length) return;
    currentEntries = cleanEntries(rawEntries);
    renderOutput();
  });

  $('fileButton').addEventListener('click', processFile);
  $('urlButton').addEventListener('click', processOnline);
  $('textButton').addEventListener('click', processText);
  $('cancelButton').addEventListener('click', cancelProcess);
  $('outputFormat').addEventListener('change', renderOutput);
  $('downloadButton').addEventListener('click', downloadResult);
})();
</script>
</body>
</html>
